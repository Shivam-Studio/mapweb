name: Validate MapMotion Studio

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check JavaScript syntax
        run: node --check frontend/app.js
      - name: Compile Python backend and smoke test
        run: |
          python -m py_compile app.py backend/app.py backend/github_storage.py
          python -m py_compile qa_vercel_smoke.py qa_github_lfs.py
          python qa_vercel_smoke.py
          python qa_github_lfs.py
      - name: Test Git LFS hashing and browser wiring
        run: node QA_GITHUB_LFS_TEST.js
      - name: Test camera frame math
        run: node QA_CAMERA_TEST.js
      - name: Test selection colour and export behaviour
        run: node QA_EXPORT_COLOUR_TEST.js
